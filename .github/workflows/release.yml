name: Release

# Declare default permissions as read only.
permissions: read-all

on:
  push:
    branches: [main]

jobs:
  detect:
    name: Detect New Changelog Version
    permissions:
      contents: write
    uses: outoforbitdev/reusable-workflows-library/.github/workflows/detect-new-changelog-version.yml@fb57c9f8cd050cb02fd18b1d28e0fc23e8550a7a # v1.5.1
  publish:
    name: Publish Release
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    permissions:
      contents: write
    uses: outoforbitdev/reusable-workflows-library/.github/workflows/publish-release.yml@b674d318217d98c503fe511058762fb93b0f96d2 # v1.5.2
    with:
      version: ${{ needs.detect.outputs.new-version }}
      prerelease: ${{ needs.detect.outputs.is-prerelease == 'true' }}
      release-notes: ${{ needs.detect.outputs.release-notes }}
      draft: false
